name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch cancels the in-flight run — saves CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, build & 90% coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      # Fails the job if any metric drops below the 90% thresholds in vitest.config.ts.
      - run: npm run test:coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  deploy:
    name: Deploy to Vercel
    needs: verify # only deploys if the coverage gate passed
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      # production on main, preview for PRs
      PROD_FLAG: ${{ github.ref == 'refs/heads/main' && '--prod' || '' }}
      VERCEL_ENVIRONMENT: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
    steps:
      # Lets the pipeline ship the moment the three Vercel secrets are added, without
      # going red in the meantime (see plan Step 6 for how to set them).
      - name: Check Vercel configuration
        id: cfg
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Vercel secrets not set — skipping deploy. Add VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID repo secrets to enable."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.cfg.outputs.enabled == 'true'
      - uses: actions/setup-node@v4
        if: steps.cfg.outputs.enabled == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install Vercel CLI
        if: steps.cfg.outputs.enabled == 'true'
        run: npm i -g vercel@latest
      - name: Pull Vercel environment
        if: steps.cfg.outputs.enabled == 'true'
        run: vercel pull --yes --environment="$VERCEL_ENVIRONMENT" --token="$VERCEL_TOKEN"
      - name: Build
        if: steps.cfg.outputs.enabled == 'true'
        run: vercel build $PROD_FLAG --token="$VERCEL_TOKEN"
      - name: Deploy
        if: steps.cfg.outputs.enabled == 'true'
        run: vercel deploy --prebuilt $PROD_FLAG --token="$VERCEL_TOKEN"
